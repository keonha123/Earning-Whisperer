services:
  redis:
    image: redis:latest
    container_name: ew-redis
    ports:
      - "6379:6379"
    networks:
      - ew-network

  db:
    image: mysql:8.0
    container_name: ew-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: earning_whisperer
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - ew-network

  postgres:
    image: postgres:16
    container_name: ew-postgres
    environment:
      POSTGRES_DB: earningwhisperer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-storage:/var/lib/postgresql/data
    networks:
      - ew-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ew-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - ew-network

  browser-webcast:
    build:
      context: ..
      dockerfile: data_pipeline/Dockerfile.browser
    container_name: ew-browser-webcast
    profiles:
      - tools
    working_dir: /app
    environment:
      DB_URL: mysql+pymysql://user:password@db:3306/earning_whisperer
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ../:/app
    networks:
      - ew-network
    shm_size: "1gb"
    ipc: host
    init: true
    command:
      - python
      - -m
      - data_pipeline.collectors.streams.browser_webcast
      - --help

  pipeline-scheduler:
    build:
      context: ..
      dockerfile: data_pipeline/Dockerfile.browser
    container_name: ew-pipeline-scheduler
    profiles:
      - ops
    working_dir: /app
    env_file:
      - ../data_pipeline/.env
    environment:
      DB_URL: mysql+pymysql://user:password@db:3306/earning_whisperer
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      WEBCAST_CAPTURE_RUNNER: container
    volumes:
      - ../:/app
    networks:
      - ew-network
    depends_on:
      - db
    shm_size: "1gb"
    ipc: host
    init: true
    restart: unless-stopped
    command:
      - python
      - -m
      - data_pipeline.main

networks:
  ew-network:
    driver: bridge

volumes:
  mysql-data:
  qdrant-storage:
  postgres-storage:
