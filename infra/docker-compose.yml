services:
  redis:
    image: redis:7-alpine
    container_name: ew-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ew-network

  db:
    image: mysql:8.0
    container_name: ew-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: earning_whisperer
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - ew-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ew-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: earningwhisperer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-storage:/var/lib/postgresql/data
      - ../ai-engine/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d earningwhisperer"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ew-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ew-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - ew-network

networks:
  ew-network:
    driver: bridge

volumes:
  postgres-storage:
  qdrant-storage:
