server:
  port: 8082

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  datasource:
    url: jdbc:mysql://localhost:3306/earningwhisperer?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  # 운영 환경에서는 반드시 환경변수로 주입. 최소 32자(256-bit) 이상.
  secret: ${JWT_SECRET:earning-whisperer-dev-secret-key-minimum-32-chars}
  expiration-ms: 900000  # 15분 (ms)
  refresh-expiration-seconds: 604800  # 7일 (s)
  cookie-secure: ${JWT_COOKIE_SECURE:false}  # 운영: true (HTTPS only)
  # 환경별 issuer/audience 로 토큰 교차 통용 차단. 환경마다 다르게 주입 권장.
  issuer: ${JWT_ISSUER:earning-whisperer}
  audience: ${JWT_AUDIENCE:earning-whisperer-api}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    allowed-redirect-uris: ${GOOGLE_REDIRECT_URIS:http://localhost:3000/auth/callback}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    allowed-redirect-uris: ${KAKAO_REDIRECT_URIS:http://localhost:3000/auth/callback}

finnhub:
  base-url: https://finnhub.io/api/v1
  api-key: ${FINNHUB_API_KEY:}   # 미설정 시 어닝 일정 스케줄러 비활성화
  ws-keys:                        # 키당 50심볼 구독. 추가 키 = 다음 50개 자동 커버
    - ${FINNHUB_API_KEY:}         # WS 1번 키 (기본: REST 키와 동일)

fmp:
  base-url: https://financialmodelingprep.com
  api-key: ${FMP_API_KEY:}       # 미설정 시 S&P 500 분기 동기화 스케줄러 비활성화

app:
  internal:
    # Data Pipeline → Backend 내부 엔드포인트(/api/v1/internal/**) 공유 시크릿.
    # 운영/배포 환경에서는 반드시 환경변수 INTERNAL_SECRET 으로 주입.
    # 미설정(빈 문자열) 시 InternalSecretFilter 가 모든 internal 요청을 401 로 차단한다.
    secret: ${INTERNAL_SECRET:}

  cors:
    # 콤마 구분 origin 목록. 운영 도메인 / vercel 프리뷰 패턴을 환경변수 CORS_ALLOWED_ORIGINS 로 주입.
    # 정확한 origin (스킴+호스트+포트) 또는 와일드카드 패턴 (예: https://*-keonha123.vercel.app) 모두 허용.
    # 미설정 시 dev 로컬 호스트(3000/5173) 만 허용.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  trade:
    # PENDING Trade 명령의 유효시간(초). 발행 후 이 시간 내에 Trading Terminal 이
    # 콜백을 보내지 않으면 scheduler 가 EXPIRED 로 전환한다. 자동매매 신호의 시의성을
    # 고려해 짧게 잡는다.
    pending-ttl-seconds: ${TRADE_PENDING_TTL_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
