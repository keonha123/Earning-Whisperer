# 세 모듈의 테스트를 PR 과 main 푸시에서 자동으로 돌립니다.
#
# 로컬 실행만으로는 놓치는 지점이 있어서 둡니다. Gradle 이 `UP-TO-DATE` 로 판단해
# 테스트를 건너뛰고 종료 코드 0 을 돌려준 적이 있었고, 출력이 없어 통과한 것처럼
# 보였습니다. CI 는 매번 깨끗한 환경에서 돌기 때문에 이런 착각이 생기지 않습니다.
#
# 세 잡은 서로 독립이라 병렬로 돕니다. 한 모듈이 실패해도 나머지 결과를 보고
# 싶어서 fail-fast 를 쓰지 않습니다.
name: test

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 연달아 푸시하면 앞선 실행을 취소합니다.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 테스트는 H2 인메모리 DB 를 쓰고(src/test/resources/application.yml),
      # Redis 는 Lettuce 가 지연 연결이라 실제로 붙지 않습니다. 서비스 컨테이너를
      # 띄우지 않아도 466건이 통과하는 것을 확인했습니다.
      - name: Run tests
        working-directory: backend
        run: ./gradlew test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  terminal:
    name: trading-terminal (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: trading-terminal/package-lock.json

      # postinstall 의 electron-rebuild 는 keytar 네이티브 모듈을 Electron ABI 에
      # 맞춰 다시 빌드합니다. 테스트는 vitest(Node)에서 돌고 keytar 를 쓰지 않으므로
      # CI 에서는 건너뜁니다. 시간이 오래 걸리고 실패 지점만 늘어납니다.
      #
      # `npm ci` 가 아니라 `npm install` 인 이유: 현재 커밋된 package.json 과
      # package-lock.json 이 동기화되어 있지 않아 `npm ci` 가 EUSAGE 로 실패합니다
      # (`Missing: @emnapi/core@1.11.3 from lock file`). 두 파일을 갱신해 커밋하면
      # `npm ci` 로 바꾸는 편이 좋습니다 — 락 파일을 그대로 재현하므로 CI 결과가
      # 안정적입니다.
      - name: Install dependencies
        working-directory: trading-terminal
        run: npm install --ignore-scripts

      - name: Typecheck
        working-directory: trading-terminal
        run: npm run typecheck

      - name: Run tests
        working-directory: trading-terminal
        run: npm test

  ai-engine:
    name: ai-engine (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install dependencies
        working-directory: ai-engine
        run: pip install -r requirements.txt

      # .env 없이 197건이 통과하는 것을 확인했습니다. CI 에 API 키를 두지 않습니다.
      - name: Run tests
        working-directory: ai-engine
        run: python -m pytest -q
