name: 조사 · 검증
description: 무엇을 만들지 정하기 전에 확인이 필요한 것 (측정 · 실험 · 조사)
title: "[spike] "
labels: ["spike"]
body:
  - type: markdown
    attributes:
      value: |
        코드를 만드는 이슈가 아니라, 질문에 답을 내는 이슈입니다. 답이 나오면 이 이슈를 닫고
        필요하면 기능 이슈를 새로 열면 됩니다.

        기획 판단의 근거가 아직 없을 때 (예: "팩트체크 판정이 실제로 맞는가?") 쓰기 좋습니다.

  - type: textarea
    id: question
    attributes:
      label: 답해야 하는 질문
      description: 하나씩 적어 주세요. 질문이 여러 개면 이슈를 나누는 편이 진행 상황을 보기 좋습니다.
      placeholder: |
        예) 팩트체크 판정(SUPPORTED / CONTRADICTED / INSUFFICIENT_EVIDENCE)이
        사람 판단과 얼마나 일치하는가?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 왜 알아야 하나
      description: |
        이 답이 어떤 결정을 바꾸는지 적어 주세요. 결정이 바뀌지 않는다면 조사를 미뤄도
        괜찮다는 판단에 쓸 수 있습니다.
      placeholder: |
        "쓸만한 걸 만들었나" 에 답할 근거가 아직 없습니다. 발표에서 정확도를 물으면
        현재로서는 "측정하지 않았다" 가 정확한 답입니다.
    validations:
      required: true

  - type: textarea
    id: method
    attributes:
      label: 조사 방법
      description: |
        어떻게 답을 낼지 적어 주세요. 표본 수, 측정 지표, 판정 기준이 함께 있으면
        결과를 다시 읽을 때 해석이 쉽습니다.
      placeholder: |
        1. 시연 스크립트 24세그먼트를 3회 재생 → 판정 결과 수집 (약 24건)
        2. 다른 종목 콜 1개를 추가로 확보해 표본 50건까지 확대
        3. 각 판정을 사람이 라벨링 (근거 기사를 직접 읽고 동의 / 비동의 / 판단 불가)
        4. 일치율 + INSUFFICIENT_EVIDENCE 비율 + 근거 없이 SUPPORTED 로 나온 건수
    validations:
      required: true

  - type: input
    id: timebox
    attributes:
      label: 타임박스
      description: 여기까지 하고 멈추는 기준입니다. 답이 안 나와도 멈추고 그 사실을 적어 두면 됩니다.
      placeholder: "예) 4시간"
    validations:
      required: true

  - type: textarea
    id: deliverable
    attributes:
      label: 산출물
      description: 이 이슈가 닫힐 때 남는 것. 코드가 아니라 문서 · 표 · 숫자입니다.
      placeholder: |
        - docs/ 에 측정 결과 표 1장 (표본 수, 일치율, 오판 건수)
        - 발표에서 쓸 문장 1~2줄
    validations:
      required: true

  - type: textarea
    id: findings
    attributes:
      label: 결과 (조사 후 작성)
      description: 조사를 마친 뒤 답을 적고 이슈를 닫습니다. 예상과 달랐던 점도 함께 있으면 좋습니다.
